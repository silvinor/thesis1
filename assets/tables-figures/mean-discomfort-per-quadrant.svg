<svg viewBox="23 17 585 339" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
    <title id="ttl">Mean discomfort by oddity condition and activity level</title>
    <desc id="dsc">Grouped bar chart of mean discomfort rating for No oddity vs Oddity conditions, split by Low vs High activity, with 95% CI error bars.</desc>

    <defs>
        <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse" stroke-width="0">
            <rect x="0" y="0" width="4" height="4" />
            <circle cx="1" cy="1" r=".01" stroke-width="1" />
            <circle cx="3" cy="3" r=".01" stroke-width="1" />
        </pattern>
        <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)" stroke-width="0">
            <rect x="0" y="0" width="4" height="4" />
            <line x1="0" y1="0" x2="4" y2="0" stroke-width="2" />
        </pattern>
    </defs>
    
    <style>
        pattern line,
        pattern circle { 
            stroke: #111;
        }
        pattern rect {
            fill: #FFF;
        }
        line.invert {
            stroke: #FFF;
        }

        rect, line, polygon, path { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            pattern line,
            pattern circle { 
                stroke: #EEE;
            }
            pattern rect {
                fill: #111;
            }
            line.invert {
                stroke: #111;
            }

            rect, line, polygon, path { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .right { text-anchor: end; }
        .center { text-anchor: middle; }
        .small { font-size: 9pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 1.25; }
        .thin { stroke-width: 0.75; }

        .bar1 { fill: url(#dots); }
        .bar2 { fill: url(#hatch); }
        .grid { stroke-width: .5; opacity: 0.15; }
        .axis { stroke-width: 1.25; }
        .tick { stroke-width: .75; }
        .err_halo { stroke-width: 4.5; }
        .err_line { stroke-width: 1.5; }
    </style>

    <rect x="23" y="17" width="585" height="339" rx="16" stroke-width="0.001" class="bg" />

    <!-- Gridlines -->
    <line x1="90" y1="270" x2="590" y2="270" class="grid" />
    <line x1="90" y1="230" x2="590" y2="230" class="grid" />
    <line x1="90" y1="190" x2="590" y2="190" class="grid" />
    <line x1="90" y1="150" x2="590" y2="150" class="grid" />
    <line x1="90" y1="110" x2="590" y2="110" class="grid" />
    <line x1="90" y1="70"  x2="590" y2="70"  class="grid" />

    <!-- Axes -->
    <line x1="90" y1="70" x2="90" y2="310" class="axis" />
    <line x1="90" y1="310" x2="590" y2="310" class="axis" />

    <!-- Y ticks + labels -->
    <line x1="85" y1="310" x2="90" y2="310" class="tick" />
    <line x1="85" y1="270" x2="90" y2="270" class="tick" />
    <line x1="85" y1="230" x2="90" y2="230" class="tick" />
    <line x1="85" y1="190" x2="90" y2="190" class="tick" />
    <line x1="85" y1="150" x2="90" y2="150" class="tick" />
    <line x1="85" y1="110" x2="90" y2="110" class="tick" />
    <line x1="85" y1="70"  x2="90" y2="70"  class="tick" />
    <text x="82" y="314" class="right">1.0</text>
    <text x="82" y="274" class="right">1.5</text>
    <text x="82" y="234" class="right">2.0</text>
    <text x="82" y="194" class="right">2.5</text>
    <text x="82" y="154" class="right">3.0</text>
    <text x="82" y="114" class="right">3.5</text>
    <text x="82" y="74"  class="right">4.0</text>

    <text class="center" transform="rotate(-90 48 190)" x="48" y="190">Mean discomfort rating</text>

    <!-- Bars: No oddity (band center 215) -->
    <path d="M126,310 L126,278 Q126,272 132,272 L208,272 Q214,272 214,278 L214,310 Z" class="bar1" />
    <path d="M216,310 L216,263 Q216,257 222,257 L298,257 Q304,257 304,263 L304,310 Z" class="bar2" />

    <!-- Bars: Oddity (band center 465) -->
    <path d="M376,310 L376,222 Q376,216 382,216 L458,216 Q464,216 464,222 L464,310 Z" class="bar1" />
    <path d="M466,310 L466,195 Q466,189 472,189 L548,189 Q554,189 554,195 L554,310 Z" class="bar2" />

    <!-- Error bars (95% CI), white halo first so they read against the dark bar -->
    <line x1="170" y1="277" x2="170" y2="267" class="err_halo invert" />
    <line x1="160" y1="277" x2="180" y2="277" class="err_halo invert" />
    <line x1="160" y1="267" x2="180" y2="267" class="err_halo invert" />
    <line x1="170" y1="277" x2="170" y2="267" class="err_line" />
    <line x1="160" y1="277" x2="180" y2="277" class="err_line" />
    <line x1="160" y1="267" x2="180" y2="267" class="err_line" />

    <line x1="260" y1="262" x2="260" y2="252" class="err_halo invert" />
    <line x1="250" y1="262" x2="270" y2="262" class="err_halo invert" />
    <line x1="250" y1="252" x2="270" y2="252" class="err_halo invert" />
    <line x1="260" y1="262" x2="260" y2="252" class="err_line" />
    <line x1="250" y1="262" x2="270" y2="262" class="err_line" />
    <line x1="250" y1="252" x2="270" y2="252" class="err_line" />

    <line x1="420" y1="224" x2="420" y2="210" class="err_halo invert" />
    <line x1="410" y1="224" x2="430" y2="224" class="err_halo invert" />
    <line x1="410" y1="210" x2="430" y2="210" class="err_halo invert" />
    <line x1="420" y1="224" x2="420" y2="210" class="err_line" />
    <line x1="410" y1="224" x2="430" y2="224" class="err_line" />
    <line x1="410" y1="210" x2="430" y2="210" class="err_line" />

    <line x1="510" y1="196" x2="510" y2="182" class="err_halo invert" />
    <line x1="500" y1="196" x2="520" y2="196" class="err_halo invert" />
    <line x1="500" y1="182" x2="520" y2="182" class="err_halo invert" />
    <line x1="510" y1="196" x2="510" y2="182" class="err_line" />
    <line x1="500" y1="196" x2="520" y2="196" class="err_line" />
    <line x1="500" y1="182" x2="520" y2="182" class="err_line" />

    <!-- X category labels -->
    <text x="215" y="334" class="center">No oddity</text>
    <text x="465" y="334" class="center">Oddity present</text>

    <!-- Legend -->
    <rect x="355" y="37" width="12" height="12" class="bar1" />
    <text x="373" y="47" class="left">Low activity</text>
    <rect x="482" y="37" width="12" height="12" class="bar2" />
    <text x="500" y="47" class="left">High activity</text>
</svg>
