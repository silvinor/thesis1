<svg viewBox="23 17 585 409" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
    <title id="ttl">Mean unexpectedness by oddity condition and activity level</title>
    <desc id="dsc">Grouped bar chart of mean unexpectedness rating for No oddity vs Oddity conditions, split by Low vs High activity, with 95% CI error bars.</desc>

    <defs>
        <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse" fill="#202020">
            <rect x="0" y="0" width="4" height="4" stroke="none" fill="#FFF" />
            <circle cx="1" cy="1" r=".5" />
            <circle cx="3" cy="3" r=".5" />
        </pattern>
        <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect x="0" y="0" width="4" height="4" stroke="none" fill="#FFF" />
            <line x1="0" y1="0" x2="4" y2="0" stroke="#202020" stroke-width="2" />
        </pattern>
    </defs>    
    <style>
        text {
            font-family: "Times New Roman", Times, serif;
            fill: #111111;
        }
        .axis_lbl { font-size: 11.5px; font-weight: 700; }
        .cat_lbl { font-size: 13px; font-weight: 600; text-anchor: middle; }
        .axis_title { font-size: 13px; font-weight: 600; text-anchor: middle; }
        .legend_lbl { font-size: 12.5px; text-anchor: start; }
        .grid { stroke: #111111; stroke-width: 1; opacity: 0.15; }
        .axis_line { stroke: #111111; stroke-width: 1.25; }
        .tick { stroke: #111111; stroke-width: 1; }
        .bar_low { fill: url(#dots); stroke: #111111; stroke-width: 1; }
        .bar_high { fill: url(#hatch); stroke: #111111; stroke-width: 1; }
        .err_halo { stroke: #ffffff; stroke-width: 4.5; }
        .err { stroke: #111111; stroke-width: 1.5; }
    </style>

    <rect x="23" y="17" width="585" height="409" rx="16" fill="#ffffff" />

    <!-- Gridlines -->
    <line x1="90" y1="340" x2="590" y2="340" class="grid" />
    <line x1="90" y1="300" x2="590" y2="300" class="grid" />
    <line x1="90" y1="260" x2="590" y2="260" class="grid" />
    <line x1="90" y1="220" x2="590" y2="220" class="grid" />
    <line x1="90" y1="180" x2="590" y2="180" class="grid" />
    <line x1="90" y1="140" x2="590" y2="140" class="grid" />
    <line x1="90" y1="100" x2="590" y2="100" class="grid" />
    <line x1="90" y1="60" x2="590" y2="60" class="grid" />

    <!-- Axes -->
    <line x1="90" y1="60" x2="90" y2="380" class="axis_line" />
    <line x1="90" y1="380" x2="590" y2="380" class="axis_line" />

    <!-- Y ticks + labels -->
    <line x1="85" y1="380" x2="90" y2="380" class="tick" />
    <text x="82" y="384" class="axis_lbl" text-anchor="end">1.0</text>
    <line x1="85" y1="340" x2="90" y2="340" class="tick" />
    <text x="82" y="344" class="axis_lbl" text-anchor="end">1.5</text>
    <line x1="85" y1="300" x2="90" y2="300" class="tick" />
    <text x="82" y="304" class="axis_lbl" text-anchor="end">2.0</text>
    <line x1="85" y1="260" x2="90" y2="260" class="tick" />
    <text x="82" y="264" class="axis_lbl" text-anchor="end">2.5</text>
    <line x1="85" y1="220" x2="90" y2="220" class="tick" />
    <text x="82" y="224" class="axis_lbl" text-anchor="end">3.0</text>
    <line x1="85" y1="180" x2="90" y2="180" class="tick" />
    <text x="82" y="184" class="axis_lbl" text-anchor="end">3.5</text>
    <line x1="85" y1="140" x2="90" y2="140" class="tick" />
    <text x="82" y="144" class="axis_lbl" text-anchor="end">4.0</text>
    <line x1="85" y1="100" x2="90" y2="100" class="tick" />
    <text x="82" y="104" class="axis_lbl" text-anchor="end">4.5</text>
    <line x1="85" y1="60" x2="90" y2="60" class="tick" />
    <text x="82" y="64" class="axis_lbl" text-anchor="end">5.0</text>

    <text class="axis_title" transform="rotate(-90 48 220)" x="48" y="220">Mean unexpectedness rating</text>

    <!-- Bars: No oddity (band center 215) -->
    <path d="M126,380 L126,344 Q126,338 132,338 L208,338 Q214,338 214,344 L214,380 Z" class="bar_low" />
    <path d="M216,380 L216,353 Q216,347 222,347 L298,347 Q304,347 304,353 L304,380 Z" class="bar_high" />

    <!-- Bars: Oddity (band center 465) -->
    <path d="M376,380 L376,128 Q376,122 382,122 L458,122 Q464,122 464,128 L464,380 Z" class="bar_low" />
    <path d="M466,380 L466,118 Q466,112 472,112 L548,112 Q554,112 554,118 L554,380 Z" class="bar_high" />

    <!-- Error bars (95% CI), white halo first so they read against the dark bar -->
    <line x1="170" y1="344" x2="170" y2="333" class="err_halo" />
    <line x1="160" y1="344" x2="180" y2="344" class="err_halo" />
    <line x1="160" y1="333" x2="180" y2="333" class="err_halo" />
    <line x1="170" y1="344" x2="170" y2="333" class="err" />
    <line x1="160" y1="344" x2="180" y2="344" class="err" />
    <line x1="160" y1="333" x2="180" y2="333" class="err" />

    <line x1="260" y1="353" x2="260" y2="342" class="err_halo" />
    <line x1="250" y1="353" x2="270" y2="353" class="err_halo" />
    <line x1="250" y1="342" x2="270" y2="342" class="err_halo" />
    <line x1="260" y1="353" x2="260" y2="342" class="err" />
    <line x1="250" y1="353" x2="270" y2="353" class="err" />
    <line x1="250" y1="342" x2="270" y2="342" class="err" />

    <line x1="420" y1="128" x2="420" y2="116" class="err_halo" />
    <line x1="410" y1="128" x2="430" y2="128" class="err_halo" />
    <line x1="410" y1="116" x2="430" y2="116" class="err_halo" />
    <line x1="420" y1="128" x2="420" y2="116" class="err" />
    <line x1="410" y1="128" x2="430" y2="128" class="err" />
    <line x1="410" y1="116" x2="430" y2="116" class="err" />

    <line x1="510" y1="118" x2="510" y2="106" class="err_halo" />
    <line x1="500" y1="118" x2="520" y2="118" class="err_halo" />
    <line x1="500" y1="106" x2="520" y2="106" class="err_halo" />
    <line x1="510" y1="118" x2="510" y2="106" class="err" />
    <line x1="500" y1="118" x2="520" y2="118" class="err" />
    <line x1="500" y1="106" x2="520" y2="106" class="err" />

    <!-- X category labels -->
    <text x="215" y="404" class="cat_lbl">No oddity</text>
    <text x="465" y="404" class="cat_lbl">Oddity present</text>

    <!-- Legend -->
    <rect x="355" y="37" width="12" height="12" class="bar_low" />
    <text x="373" y="47" class="legend_lbl">Low activity</text>
    <rect x="482" y="37" width="12" height="12" class="bar_high" />
    <text x="500" y="47" class="legend_lbl">High activity</text>
</svg>
