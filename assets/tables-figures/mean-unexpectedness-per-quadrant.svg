<svg viewBox="23 17 585 409" width="585" height="409" xmlns="http://www.w3.org/2000/svg" role="img">
    <title id="ttl">Mean unexpectedness by oddity condition and activity level</title>
    <desc id="dsc">Grouped bar chart of mean unexpectedness rating for No oddity vs Oddity conditions, split by Low vs High activity, with 95% CI error bars.</desc>

    <defs>
        <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse" stroke-width="0">
            <rect x="0" y="0" width="4" height="4" />
            <circle cx="1" cy="1" r=".01" stroke-width="1" />
            <circle cx="3" cy="3" r=".01" stroke-width="1" />
        </pattern>
        <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)" stroke-width="0">
            <rect x="0" y="0" width="4" height="4" />
            <line x1="0" y1="0" x2="4" y2="0" stroke-width="2" />
        </pattern>
    </defs>

    <style>
        pattern line,
        pattern circle { 
            stroke: #111;
        }
        pattern rect {
            fill: #FFF;
        }
        line.invert {
            stroke: #FFF;
        }

        rect, line, polygon, path { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            pattern line,
            pattern circle { 
                stroke: #EEE;
            }
            pattern rect {
                fill: #111;
            }
            line.invert {
                stroke: #111;
            }

            rect, line, polygon, path { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .right { text-anchor: end; }
        .center { text-anchor: middle; }
        .small { font-size: 9pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 1.25; }
        .thin { stroke-width: 0.75; }

        .bar1 { fill: url(#dots); }
        .bar2 { fill: url(#hatch); }
        .grid { stroke-width: .5; opacity: 0.15; }
        .axis { stroke-width: 1.25; }
        .tick { stroke-width: .75; }
        .err_halo { stroke-width: 4.5; }
        .err_line { stroke-width: 1.5; }
    </style>

    <rect x="23" y="17" width="585" height="409" rx="16" class="bg" stroke-width="0.001" />

    <!-- Gridlines -->
    <line x1="90" y1="340" x2="590" y2="340" class="grid" />
    <line x1="90" y1="300" x2="590" y2="300" class="grid" />
    <line x1="90" y1="260" x2="590" y2="260" class="grid" />
    <line x1="90" y1="220" x2="590" y2="220" class="grid" />
    <line x1="90" y1="180" x2="590" y2="180" class="grid" />
    <line x1="90" y1="140" x2="590" y2="140" class="grid" />
    <line x1="90" y1="100" x2="590" y2="100" class="grid" />
    <line x1="90" y1="60" x2="590" y2="60" class="grid" />

    <!-- Axes -->
    <line x1="90" y1="60" x2="90" y2="380" class="axis" />
    <line x1="90" y1="380" x2="590" y2="380" class="axis" />

    <!-- Y ticks + labels -->
    <line x1="85" y1="380" x2="90" y2="380" class="tick" />
    <line x1="85" y1="340" x2="90" y2="340" class="tick" />
    <line x1="85" y1="300" x2="90" y2="300" class="tick" />
    <line x1="85" y1="260" x2="90" y2="260" class="tick" />
    <line x1="85" y1="220" x2="90" y2="220" class="tick" />
    <line x1="85" y1="180" x2="90" y2="180" class="tick" />
    <line x1="85" y1="140" x2="90" y2="140" class="tick" />
    <line x1="85" y1="100" x2="90" y2="100" class="tick" />
    <line x1="85" y1="60"  x2="90" y2="60"  class="tick" />
    <text x="82" y="384" class="right">1.0</text>
    <text x="82" y="344" class="right">1.5</text>
    <text x="82" y="304" class="right">2.0</text>
    <text x="82" y="264" class="right">2.5</text>
    <text x="82" y="224" class="right">3.0</text>
    <text x="82" y="184" class="right">3.5</text>
    <text x="82" y="144" class="right">4.0</text>
    <text x="82" y="104" class="right">4.5</text>
    <text x="82" y="64"  class="right">5.0</text>

    <text class="center" transform="rotate(-90 48 220)" x="48" y="220">Mean unexpectedness rating</text>

    <!-- Bars: No oddity (band center 215) -->
    <path d="M126,380 L126,344 Q126,338 132,338 L208,338 Q214,338 214,344 L214,380 Z" class="bar1" />
    <path d="M216,380 L216,353 Q216,347 222,347 L298,347 Q304,347 304,353 L304,380 Z" class="bar2" />

    <!-- Bars: Oddity (band center 465) -->
    <path d="M376,380 L376,128 Q376,122 382,122 L458,122 Q464,122 464,128 L464,380 Z" class="bar1" />
    <path d="M466,380 L466,118 Q466,112 472,112 L548,112 Q554,112 554,118 L554,380 Z" class="bar2" />

    <!-- Error bars (95% CI), white halo first so they read against the dark bar -->
    <line x1="170" y1="344" x2="170" y2="333" class="err_halo invert" />
    <line x1="160" y1="344" x2="180" y2="344" class="err_halo invert" />
    <line x1="160" y1="333" x2="180" y2="333" class="err_halo invert" />
    <line x1="170" y1="344" x2="170" y2="333" class="err_line" />
    <line x1="160" y1="344" x2="180" y2="344" class="err_line" />
    <line x1="160" y1="333" x2="180" y2="333" class="err_line" />

    <line x1="260" y1="353" x2="260" y2="342" class="err_halo invert" />
    <line x1="250" y1="353" x2="270" y2="353" class="err_halo invert" />
    <line x1="250" y1="342" x2="270" y2="342" class="err_halo invert" />
    <line x1="260" y1="353" x2="260" y2="342" class="err_line" />
    <line x1="250" y1="353" x2="270" y2="353" class="err_line" />
    <line x1="250" y1="342" x2="270" y2="342" class="err_line" />

    <line x1="420" y1="128" x2="420" y2="116" class="err_halo invert" />
    <line x1="410" y1="128" x2="430" y2="128" class="err_halo invert" />
    <line x1="410" y1="116" x2="430" y2="116" class="err_halo invert" />
    <line x1="420" y1="128" x2="420" y2="116" class="err_line" />
    <line x1="410" y1="128" x2="430" y2="128" class="err_line" />
    <line x1="410" y1="116" x2="430" y2="116" class="err_line" />

    <line x1="510" y1="118" x2="510" y2="106" class="err_halo invert" />
    <line x1="500" y1="118" x2="520" y2="118" class="err_halo invert" />
    <line x1="500" y1="106" x2="520" y2="106" class="err_halo invert" />
    <line x1="510" y1="118" x2="510" y2="106" class="err_line" />
    <line x1="500" y1="118" x2="520" y2="118" class="err_line" />
    <line x1="500" y1="106" x2="520" y2="106" class="err_line" />

    <!-- X category labels -->
    <text x="215" y="404" class="center">No oddity</text>
    <text x="465" y="404" class="center">Oddity present</text>

    <!-- Legend -->
    <rect x="355" y="37" width="12" height="12" class="bar1" />
    <text x="373" y="47" class="left">Low activity</text>
    <rect x="482" y="37" width="12" height="12" class="bar2" />
    <text x="500" y="47" class="left">High activity</text>
</svg>
