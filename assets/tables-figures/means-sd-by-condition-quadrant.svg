<svg viewBox="0 0 830 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
    <title id="ttl">Means and standard deviations by condition (quadrant layout)</title>
    <desc id="dsc">APA-7 formatted table of Unexpectedness and Discomfort M, SD, and 95% CI, crossed by oddity condition (No oddity / Oddity) and activity level (Low / High).</desc>

    <style>
        rect, line, polygon { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            rect, line, polygon { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .center { text-anchor: middle; }
        .small { font-size: 9pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 1.25; }
        .thin { stroke-width: 0.75; }
    </style>

    <rect x="0" y="0" width="830" height="270" rx="16" class="bg" stroke-width="0.001" />

    <!-- Top rule -->
    <line x1="18" y1="18" x2="812" y2="18" class="thick" />

    <!-- Group headers -->
    <text x="315" y="38" class="center bold">No oddity</text>
    <text x="657" y="38" class="center bold">Oddity</text>

    <!-- Group underlines (span only the M / SD / 95% CI sub-columns) -->
    <line x1="165" y1="48" x2="465" y2="48" class="thin" />
    <line x1="507" y1="48" x2="807" y2="48" class="thin" />

    <!-- Sub-column headers -->
    <text x="18" y="68" class="left bold">Activity (noise)</text>
    <text x="205" y="68" class="center bold italic">M</text>
    <text x="295" y="68" class="center bold italic">SD</text>
    <text x="405" y="68" class="center bold">95% CI</text>
    <text x="547" y="68" class="center bold italic">M</text>
    <text x="637" y="68" class="center bold italic">SD</text>
    <text x="747" y="68" class="center bold">95% CI</text>

    <!-- Header rule -->
    <line x1="18" y1="78" x2="812" y2="78" class="thick" />

    <!-- Section: Unexpectedness -->
    <text x="486" y="98" class="center bold">Unexpectedness</text>

    <text x="18" y="126" class="left bold">Low</text>
    <text x="205" y="126" class="center">1.52</text>
    <text x="295" y="126" class="center">0.90</text>
    <text x="405" y="126" class="center">[1.45, 1.59]</text>
    <text x="547" y="126" class="center">4.22</text>
    <text x="637" y="126" class="center">0.98</text>
    <text x="747" y="126" class="center">[4.15, 4.30]</text>

    <text x="18" y="154" class="left bold">High</text>
    <text x="205" y="154" class="center">1.41</text>
    <text x="295" y="154" class="center">0.84</text>
    <text x="405" y="154" class="center">[1.34, 1.47]</text>
    <text x="547" y="154" class="center">4.35</text>
    <text x="637" y="154" class="center">1.02</text>
    <text x="747" y="154" class="center">[4.27, 4.42]</text>

    <!-- Section divider -->
    <line x1="18" y1="165" x2="812" y2="165" class="thick" />

    <!-- Section: Discomfort -->
    <text x="486" y="185" class="center bold">Discomfort</text>

    <text x="18"  y="213" class="left bold">Low</text>
    <text x="205" y="213" class="center">1.47</text>
    <text x="295" y="213" class="center">0.88</text>
    <text x="405" y="213" class="center">[1.41, 1.54]</text>
    <text x="547" y="213" class="center">2.17</text>
    <text x="637" y="213" class="center">1.10</text>
    <text x="747" y="213" class="center">[2.08, 2.25]</text>

    <text x="18"  y="241" class="left bold">High</text>
    <text x="205" y="241" class="center">1.66</text>
    <text x="295" y="241" class="center">0.89</text>
    <text x="405" y="241" class="center">[1.60, 1.73]</text>
    <text x="547" y="241" class="center">2.51</text>
    <text x="637" y="241" class="center">1.14</text>
    <text x="747" y="241" class="center">[2.43, 2.60]</text>

    <!-- Bottom rule -->
    <line x1="18" y1="252" x2="812" y2="252" class="thick" />
</svg>
