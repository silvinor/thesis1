<svg viewBox="0 0 806 178" width="806" height="178" xmlns="http://www.w3.org/2000/svg" role="img">
    <title id="ttl">Regression of discomfort</title>
    <desc id="dsc">APA-7 formatted regression table predicting discomfort from oddity, activity (noise), and their interaction, with b, SE, 95% CI, beta, t, p, and sr squared.</desc>

    <style>
        rect, line, polygon { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            rect, line, polygon { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .center { text-anchor: middle; }
        .small { font-size: 9pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 1.25; }
        .thin { stroke-width: 0.75; }
    </style>

    <rect x="0" y="0" width="806" height="178" rx="16" class="bg" stroke-width="0.001" />

    <!-- Top rule -->
    <line x1="18" y1="18" x2="788" y2="18" class="thick" />

    <!-- Column headers -->
    <text x="18" y="38" class="left bold">Term</text>
    <text x="253" y="38" class="center bold italic">b</text>
    <text x="318" y="38" class="center bold italic">SE</text>
    <text x="428" y="38" class="center bold">95% CI</text>
    <text x="538" y="38" class="center bold">&#946;</text>
    <text x="603" y="38" class="center bold italic">t</text>
    <text x="678" y="38" class="center bold italic">p</text>
    <text x="753" y="38" class="center bold"><tspan class="italic">sr</tspan>&#178;</text>

    <!-- Header rule -->
    <line x1="18" y1="48" x2="788" y2="48" class="thin" />

    <!-- Row 1: Constant -->
    <text x="18" y="67" class="left">Constant</text>
    <text x="253" y="67" class="center">1.475</text>
    <text x="318" y="67" class="center">.038</text>
    <text x="428" y="67" class="center">[1.399, 1.550]</text>
    <text x="538" y="67" class="center">&#8212;</text>
    <text x="603" y="67" class="center">38.33</text>
    <text x="678" y="67" class="center">&lt; .001</text>
    <text x="753" y="67" class="center">&#8212;</text>

    <!-- Row 2: Oddity -->
    <text x="18" y="95" class="left">Oddity</text>
    <text x="253" y="95" class="center">0.690</text>
    <text x="318" y="95" class="center">.054</text>
    <text x="428" y="95" class="center">[0.584, 0.797]</text>
    <text x="538" y="95" class="center">.32</text>
    <text x="603" y="95" class="center">12.69</text>
    <text x="678" y="95" class="center">&lt; .001</text>
    <text x="753" y="95" class="center">.051</text>

    <!-- Row 3: Activity (noise) -->
    <text x="18" y="123" class="left">Activity (noise)</text>
    <text x="253" y="123" class="center">0.188</text>
    <text x="318" y="123" class="center">.054</text>
    <text x="428" y="123" class="center">[0.081, 0.294]</text>
    <text x="538" y="123" class="center">.09</text>
    <text x="603" y="123" class="center">3.45</text>
    <text x="678" y="123" class="center">&lt; .001</text>
    <text x="753" y="123" class="center">.004</text>

    <!-- Row 4: Oddity x Activity -->
    <text x="18" y="151" class="left">Oddity &#215; Activity</text>
    <text x="253" y="151" class="center">0.162</text>
    <text x="318" y="151" class="center">.077</text>
    <text x="428" y="151" class="center">[0.011, 0.313]</text>
    <text x="538" y="151" class="center">.07</text>
    <text x="603" y="151" class="center">2.11</text>
    <text x="678" y="151" class="center">.035</text>
    <text x="753" y="151" class="center">.001</text>

    <!-- Bottom rule -->
    <line x1="18" y1="160" x2="788" y2="160" class="thick" />
</svg>
