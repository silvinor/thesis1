<svg viewBox="0 0 986 178" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
    <title id="ttl">Means and standard deviations by condition</title>
    <desc id="dsc">APA-7 formatted table of Unexpectedness and Discomfort M (SD) and 95% CI by condition (oddity x activity level).</desc>

    <style>
        rect, line, polygon { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            rect, line, polygon { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .center { text-anchor: middle; }
        .small { font-size: 9pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 1.25; }
        .thin { stroke-width: 0.75; }
    </style>

    <rect x="0" y="0" width="986" height="178" rx="16" class="bg" stroke-width="0.001" />

    <!-- Top rule: 14pt (~18px) from top edge -->
    <line x1="18" y1="18" x2="968" y2="18" class="thick" />

    <!-- Column headers -->
    <text x="18" y="38" class="left bold">Condition</text>
    <text x="393" y="38" class="center bold">Unexpectedness <tspan class="italic">M</tspan> (<tspan class="italic">SD</tspan>)</text>
    <text x="573" y="38" class="center bold">95% CI</text>
    <text x="738" y="38" class="center bold">Discomfort <tspan class="italic">M</tspan> (<tspan class="italic">SD</tspan>)</text>
    <text x="903" y="38" class="center bold">95% CI</text>

    <!-- Header rule -->
    <line x1="18" y1="48" x2="968" y2="48" class="thin" />

    <!-- Row 1: No oddity / low activity -->
    <text x="18" y="67" class="left">No oddity / low activity</text>
    <text x="393" y="67" class="center">1.52 (0.90)</text>
    <text x="573" y="67" class="center">[1.45, 1.59]</text>
    <text x="738" y="67" class="center">1.47 (0.88)</text>
    <text x="903" y="67" class="center">[1.41, 1.54]</text>

    <!-- Row 2: No oddity / high activity -->
    <text x="18" y="95" class="left">No oddity / high activity</text>
    <text x="393" y="95" class="center">1.41 (0.84)</text>
    <text x="573" y="95" class="center">[1.34, 1.47]</text>
    <text x="738" y="95" class="center">1.66 (0.89)</text>
    <text x="903" y="95" class="center">[1.60, 1.73]</text>

    <!-- Row 3: Oddity / low activity -->
    <text x="18" y="123" class="left">Oddity / low activity</text>
    <text x="393" y="123" class="center">4.22 (0.98)</text>
    <text x="573" y="123" class="center">[4.15, 4.30]</text>
    <text x="738" y="123" class="center">2.17 (1.10)</text>
    <text x="903" y="123" class="center">[2.08, 2.25]</text>

    <!-- Row 4: Oddity / high activity -->
    <text x="18" y="151" class="left">Oddity / high activity</text>
    <text x="393" y="151" class="center">4.35 (1.02)</text>
    <text x="573" y="151" class="center">[4.27, 4.42]</text>
    <text x="738" y="151" class="center">2.51 (1.14)</text>
    <text x="903" y="151" class="center">[2.43, 2.60]</text>

    <!-- Bottom rule: 14pt (~18px) from bottom edge -->
    <line x1="18" y1="160" x2="968" y2="160" class="thick" />
</svg>
