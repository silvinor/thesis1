        <tspan opacity="0.7"> + direct </tspan>
        <tspan font-weight="700"> (<tspan class="i">c'</tspan>) = &#8722;0.391 </tspan>
        <tspan opacity="0.7"> &#8594; total </tspan>
        <tspan font-weight="700"> (<tspan class="i">c</tspan>) = +0.772, <tspan class="i">p</tspan> &lt; .001</tspan>
    </text>
    <text x="360" y="380" text-anchor="middle" opacity="0.2" class="fnt_sz_s clr_blk fil_blk"> 95% Bootstrap CI [1.052, 1.275] </text>
