    <text x="180" y="160" class="fnt_sz_n fil_blk clr_blk">Path <tspan class="i">a</tspan>: <tspan class="i">B</tspan> = +2.821, <tspan class="i">p</tspan> &lt; .001</text>
    <text x="180" y="178" class="fnt_sz_s fil_blk clr_blk">more unexpected</text>
    <text x="430" y="160" class="fnt_sz_n fil_blk clr_blk">Path <tspan class="i">b</tspan>: <tspan class="i">B</tspan> = +0.412, <tspan class="i">p</tspan> &lt; .001</text>
    <text x="430" y="178" class="fnt_sz_s fil_blk clr_blk">more discomfort</text>
    <text x="360" y="252" text-anchor="middle" class="fnt_sz_n fil_blk clr_blk"><tspan class="i">c'</tspan>: <tspan class="i">B</tspan> = &#8722;0.391, <tspan class="i">p</tspan> &lt; .001</text>
    <text x="360" y="284" text-anchor="middle" class="fnt_sz_s fil_blk clr_blk">controlling for perceived unexpectedness</text>


