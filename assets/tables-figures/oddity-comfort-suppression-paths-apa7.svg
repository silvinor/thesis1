<svg viewBox="22 42 676 362" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
    <title id="ttl">Mediation paths from oddity to discomfort</title>

    <style>
        .fil_blk { fill: currentColor; }
        .clr_blk { color: currentColor; }
        .str_blk {
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: butt;
            stroke-linejoin: miter;
        }
        .fnt_sz_n, .fnt_sz_s, .fnt_foot {
            font-family: "Times New Roman", Times, serif;
            dominant-baseline: auto;
        }
        .fnt_sz_n {
            font-size: 13.5px;
            font-weight: 600;
        }
        .fnt_sz_s {
            font-size: 11.5px;
            font-weight: 400;
            opacity: 0.65;
        }
        .fnt_foot {
            font-size: 13px;
            font-weight: 300;
        }
        .box {
            stroke-width: 1.5;
