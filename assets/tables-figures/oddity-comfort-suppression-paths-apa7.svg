    <rect x="292" y="60" width="140" height="58" rx="8" class="box" />
    <text x="362" y="85" text-anchor="middle" class="fnt_sz_n fil_blk clr_blk">Perceived</text>
    <text x="362" y="103" text-anchor="middle" class="fnt_sz_n fil_blk clr_blk">Unexpectedness</text>

    <rect x="524" y="232" width="156" height="58" rx="8" class="box" />
    <text x="602" y="259" font-size="14.5" text-anchor="middle" class="fnt_sz_n fil_blk clr_blk">Discomfort</text>
    <text x="602" y="277" font-size="11.5" text-anchor="middle" class="fnt_sz_s fil_blk clr_blk">higher = more discomfort</text>


    <line x1="40" y1="330" x2="680" y2="330" stroke-width="1" stroke="#111" opacity="1" />
    <text x="360" y="358" text-anchor="middle" class="fnt_foot fil_blk clr_blk">
        <tspan opacity="0.7"> indirect </tspan>
