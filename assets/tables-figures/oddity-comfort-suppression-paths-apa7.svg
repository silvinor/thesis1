        </marker>
        <mask id="imagine-text-gaps-0t5lw9" maskUnits="userSpaceOnUse">
            <rect x="0" y="0" width="720" height="400" fill="white" />
            <rect x="192" y="145" width="70.09375" height="20" fill="black" rx="2" />
            <rect x="184" y="165" width="102.984375" height="17.5" fill="black" rx="2" />
            <rect x="466" y="145" width="70.6953125" height="20" fill="black" rx="2" />
            <rect x="466" y="165" width="75.65625" height="17.5" fill="black" rx="2" />
            <rect x="292" y="237" width="74.71875" height="20" fill="black" rx="2" />
            <rect x="248" y="271" width="191.7890625" height="17.5" fill="black" rx="2" />
